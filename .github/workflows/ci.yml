name: CI (qualidade de código)

# Gate de QUALIDADE DE CÓDIGO — reprova PR/push se typecheck/lint falharem.
# (Diferente do regression.yml, que é pipeline de RELATÓRIO de testes E2E e
#  tolera falha de teste pra publicar o dashboard Allure.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-playwright:
    name: agent-playwright — typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-playwright/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint

  python-agents:
    name: agentes Python — ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint (ruff check)
        run: ruff check agent-at agent-db agent-tasks-qa
