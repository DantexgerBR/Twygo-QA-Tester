name: Playwright Regression (Twygo)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent-playwright/**'
      - '.github/workflows/regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agent-playwright/**'

# Apenas uma execução simultânea por branch — preserva ordem do trend Allure.
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  regression:
    name: Run regression + generate Allure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-playwright/package-lock.json

      - name: Setup Java (necessário pro Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Parse XML TestLink
        run: npm run agent:parse

      # Baixa o histórico Allure da execução anterior (publicada em GH Pages)
      # para alimentar os trends.
      - name: Restore Allure history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-snapshot
        continue-on-error: true

      - name: Inject Allure history into results
        run: |
          mkdir -p outputs/allure-results
          if [ -d "../gh-pages-snapshot/history" ]; then
            cp -R ../gh-pages-snapshot/history outputs/allure-results/history
            echo "Histórico Allure restaurado."
          else
            echo "Sem histórico anterior — primeira execução."
          fi
        shell: bash

      - name: Run regression (Playwright + exploratory + report + Allure)
        env:
          REGRESSION: 'true'
          TWYGO_STAGING_USER: ${{ secrets.TWYGO_STAGING_USER }}
          TWYGO_STAGING_PASS: ${{ secrets.TWYGO_STAGING_PASS }}
        run: npm run agent:regression
        continue-on-error: true

      - name: Upload per-suite/regression HTML reports as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_number }}
          path: agent-playwright/outputs/reports/
          retention-days: 30

      - name: Upload Playwright traces (debug)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-${{ github.run_number }}
          path: agent-playwright/outputs/traces/
          retention-days: 7

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Allure report as Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: agent-playwright/outputs/allure-report/

  deploy-pages:
    name: Deploy Allure to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
