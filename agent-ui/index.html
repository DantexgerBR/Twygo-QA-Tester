    body.innerHTML = status + (first
      ? `<div class="report-box">${toggle}<div id="at-md" class="md"><div class="loading"><span class="spin"></span> abrindo…</div></div></div>`
      : `<div class="empty">Nenhum test-analysis.md pra este projeto — nem no agent-at, nem publicado. 🦉</div>`);
    $('#at-gen').onclick = async () => {
      const desc = $('#at-gen-desc').value.trim();
      const btn = $('#at-gen'), msg = $('#at-gen-msg'), out = $('#at-gen-out');
      btn.disabled = true; msg.innerHTML = '<span class="spin"></span> gerando AT…'; out.innerHTML = '';
      try {
        const r = await fetch('/api/at-generate?project=' + encodeURIComponent(project), { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ description: desc }) });
        const dd = await r.json();
        if (!r.ok) { msg.innerHTML = `<b style="color:var(--coral)">${escapeHtml(dd.error||r.statusText)}</b>`; return; }
        msg.innerHTML = `<span style="color:var(--faint)">${dd.usage.in}+${dd.usage.out} tokens · ${escapeHtml(dd.model)}${dd.usedContext&&dd.usedContext.length?` · contexto: ${escapeHtml(dd.usedContext.join(', '))}`:''}</span>`;
        out.innerHTML = `<div class="db-summary"><span style="color:var(--lime)">✓ rascunho salvo</span><span style="color:var(--faint);font-weight:400;font-size:12px">· ${escapeHtml(dd.saved||'')} · revise antes de publicar</span></div><div class="report-box"><div class="md">${renderMd(dd.md||'', null)}</div></div>`;
      } catch (e) { msg.innerHTML = `<b style="color:var(--coral)">${escapeHtml(e.message)}</b>`; }
      finally { btn.disabled = false; }
    };
    // Roda /api/at-plan ou /api/at-build (SSE) — mostra fase/log ao vivo, resolve com o payload do "done".
    const runAtSSE = (path, logEl) => new Promise((resolve) => {
      logEl.textContent = '';
      const es = new EventSource(`${path}?project=${encodeURIComponent(project)}`);
      atSSE = es;
      es.onmessage = (ev) => {
        const o = JSON.parse(ev.data);
        if (o.type === 'phase') logEl.textContent += `\n▸ ${o.name}\n`;
        else if (o.type === 'log') logEl.textContent += o.line + '\n';
        logEl.scrollTop = logEl.scrollHeight;
        if (o.type === 'done') { es.close(); resolve(o); }
      };
      es.onerror = () => { es.close(); resolve({ ok: false }); };
    });
    $('#at-plan-go').onclick = async () => {
      const btn = $('#at-plan-go'), msg = $('#at-plan-msg'), log = $('#at-plan-log');
      const otherBtn = $('#at-build-go');
      btn.disabled = true; if (otherBtn) otherBtn.disabled = true;
      msg.innerHTML = '<span class="spin"></span> propondo estrutura… (pode levar minutos)';
      const o = await runAtSSE('/api/at-plan', log);
      btn.disabled = false; if (otherBtn) otherBtn.disabled = false;
      if (!o.ok || !o.estrutura) { msg.innerHTML = `<b style="color:var(--coral)">Não deu pra propor a estrutura — se o log acima está vazio, provavelmente já tem uma geração rodando pra este projeto; tente de novo em instantes. Senão, veja o log.</b>`; return; }
      msg.innerHTML = `<span style="color:var(--lime)">✓ estrutura proposta</span>`;
      $('#at-plan-estrutura').value = o.estrutura;
      $('#at-plan-review').style.display = '';
    };
    $('#at-build-go').onclick = async () => {
      const btn = $('#at-build-go'), msg = $('#at-build-msg'), log = $('#at-build-log'), out = $('#at-build-out');
      const otherBtn = $('#at-plan-go');
      btn.disabled = true; if (otherBtn) otherBtn.disabled = true; msg.innerHTML = '<span class="spin"></span> salvando estrutura aprovada…'; out.innerHTML = '';
      try {
        const ar = await fetch(`/api/at-approve?project=${encodeURIComponent(project)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ estrutura: $('#at-plan-estrutura').value }) });
        if (!ar.ok) { const ad = await ar.json(); msg.innerHTML = `<b style="color:var(--coral)">${escapeHtml(ad.error || ar.statusText)}</b>`; btn.disabled = false; if (otherBtn) otherBtn.disabled = false; return; }
      } catch (e) { msg.innerHTML = `<b style="color:var(--coral)">${escapeHtml(e.message)}</b>`; btn.disabled = false; if (otherBtn) otherBtn.disabled = false; return; }
      msg.innerHTML = '<span class="spin"></span> gerando casos + arquivos… (pode levar minutos)';
      const o = await runAtSSE('/api/at-build', log);
      btn.disabled = false; if (otherBtn) otherBtn.disabled = false;
      if (!o.ok) { msg.innerHTML = `<b style="color:var(--coral)">Falhou — se o log acima está vazio, provavelmente já tem uma geração rodando pra este projeto ou a estrutura ainda não foi aprovada (refaça o passo 1); senão, veja o log.</b>`; return; }
      msg.innerHTML = `<span style="color:var(--lime)">✓ AT gerada</span>`;
      out.innerHTML = (o.files || []).length ? `<div class="form-hint">Arquivos: ${o.files.map(escapeHtml).join(', ')}</div>` : '<div class="form-hint">Concluído, mas nenhum arquivo esperado foi encontrado — confira o log.</div>';
    };
    if (first) {
      const load = async (src) => {
        body.querySelectorAll('.rtab').forEach(t => t.classList.toggle('active', t.dataset.src === src));
        try { const r = await fetch('/api/at-md?project=' + encodeURIComponent(project) + '&source=' + src); if (!r.ok) throw new Error('test-analysis.md não encontrado'); $('#at-md').innerHTML = renderMd(await r.text(), null); }
        catch (e) { $('#at-md').innerHTML = `<div class="err">${escapeHtml(String(e.message||e))}</div>`; }
      };
      body.querySelectorAll('.rtab').forEach(t => t.onclick = () => load(t.dataset.src));
      load(first);
    }
  } catch (e) { body.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`; }
}

// ================= ROUTER =================
function setActiveNav(hash){ document.querySelectorAll('.topnav a').forEach(a => a.classList.toggle('active', hash.startsWith(a.getAttribute('href')))); }
function route() {
  const hash = location.hash || '#/';
  setActiveNav(hash);
  if (hash.startsWith('#/agentes')) return renderAgentes();
  if (hash.startsWith('#/db')) return renderDb();
  if (hash.startsWith('#/at')) return renderAt();
  if (hash.startsWith('#/testes')) return renderTestes();
  if (hash.startsWith('#/gerar')) return renderGerar();
  if (hash.startsWith('#/execucao')) return renderExecucao();
  if (hash.startsWith('#/resultados')) return renderResultados();
  if (hash.startsWith('#/custo')) return renderCusto();
  if (hash.startsWith('#/conexao')) return renderConexao();
  document.querySelectorAll('.topnav a').forEach(a=>a.classList.remove('active'));
  renderHome();
}

(async () => {
  try { projects = await api('/api/projects'); if (project && !projects.includes(project)) project=''; }
  catch (e) { $('#view').innerHTML = `<div class="err">Não consegui listar projetos: ${escapeHtml(e.message)}</div>`; return; }
  api('/api/ai-status').then(s => { const b = $('#ai-badge'); if (!b) return;
    if (!s.codex) { b.className = 'ai-badge off'; b.textContent = `🤖 ${s.engineLabel || 'IA'} —`; return; }
    if (s.needsKey && s.looksShort) { b.className = 'ai-badge warn'; b.textContent = '🤖 API ⚠ chave incompleta'; b.title = `Chave truncada (${s.len} chars) — ver Conexão`; return; }
    b.className = 'ai-badge on'; b.textContent = s.needsKey ? `🤖 API ${s.hint}` : '🤖 Codex CLI';
    b.title = s.needsKey ? '' : 'Motor: codex-cli (local, sem chave) — cai pra API automaticamente se falhar';
  }).catch(() => {});
  window.addEventListener('hashchange', route);
  route();
})();
</script>
